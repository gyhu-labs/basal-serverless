# The worker runs on the interpreter of its CUDA base image (Python 3.12).
# Keep target-version at py312: newer targets let `ruff format` rewrite
# `except (A, B):` into PEP 758 syntax, a SyntaxError on 3.12.
target-version = "py312"
line-length = 100

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
